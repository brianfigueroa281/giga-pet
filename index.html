<!DOCTYPE html>
<html>
  <head>
    <title>Your Giga Pet</title>
    <meta name="description" content="Giga Pet game made with HTML, CSS and jQuery">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>This is your Giga Pet</h1>
    </header>

    <main>
      <section class="pet-image-container">
        <div class="speech-bubble">
          <span class="groot-line"></span>
          <span class="translation"></span>
        </div>
        <img class="pet-image" src="images/groot.jpg" alt="Baby Groot waving">
        <p class="hint">tip: double-click Groot to make him dance</p>
      </section>

      <section class="dashboard">
        <div>Name: <strong><span class="name"></span></strong></div>
        <div>Weight: <strong><span class="weight"></span> pounds</strong></div>
        <div>Happiness: <strong><span class="happiness"></span> leaf wiggles (per min)</strong></div>
        <div>Water: <strong><span class="water"></span></strong></div>
        <div>Mood: <strong><span class="mood"></span></strong></div>

        <div class="button-container">
          <button class="treat-button">Treat</button>
          <button class="play-button">Play</button>
          <button class="exercise-button">Exercise</button>
          <button class="water-button">Water</button>
        </div>

        <h3>Activity log</h3>
        <ul class="log"></ul>
      </section>
    </main>

    <script src="https://code.jquery.com/jquery-2.2.1.min.js"
            integrity="sha256-gvQgAFzTH6trSrAWoH1iPo9Xc96QxSZ3feW6kem+O00="
            crossorigin="anonymous"></script>
    <script src="script.js"></script>
  </body>
</html>
